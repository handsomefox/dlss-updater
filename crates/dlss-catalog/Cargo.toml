[package]
name = "dlss-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
dlss-core = { version = "=1.4.9", path = "../dlss-core" }
jiff.workspace = true
reqwest.workspace = true
# reqwest's `rustls-no-provider` feature deliberately selects no crypto backend;
# this direct dependency exposes ring, which `GithubCatalogClient` installs once.
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true

[workspace]
members = ["crates/dlss-core", "crates/dlss-catalog", "crates/dlss-platform", "crates/dlss-app"]
resolver = "3"

[workspace.package]
version = "1.4.9"
edition = "2024"
license = "MIT"
repository = "https://github.com/handsomefox/dlss-updater"
description = "A Windows desktop app for safely updating official NVIDIA DLSS and Streamline DLLs"

[workspace.dependencies]
app-diagnostics = { git = "https://github.com/handsomefox/app-internals", tag = "v0.2.3", version = "=0.2.3" }
app-folders = { git = "https://github.com/handsomefox/app-internals", tag = "v0.2.3", version = "=0.2.3" }
app-update = { git = "https://github.com/handsomefox/app-internals", tag = "v0.2.3", version = "=0.2.3" }
app-update-ui = { git = "https://github.com/handsomefox/app-internals", tag = "v0.2.3", version = "=0.2.3" }
crossbeam-channel = "=0.5.17"
eframe = { version = "=0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "links", "persistence", "x11"] }
egui_extras = "=0.37.0"
jiff = "=0.2.38"
object = { version = "=0.40.0", features = ["pe"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tracing = "=0.1.44"
walkdir = "=2.5.0"
zip = { version = "=9.2.0", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
exit = "warn"
multiple_unsafe_ops_per_block = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
